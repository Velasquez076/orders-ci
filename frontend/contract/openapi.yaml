openapi: 3.0.1
info:
  title: Orders API
  description: REST API to calculate order totals with discounts and validate stock
    against the database.
  contact:
    name: Orders team
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Orders
  description: Order total calculation and stock validation
- name: Info
  description: Runtime environment information
paths:
  /api/orders/total:
    post:
      tags:
      - Orders
      summary: Calculate an order total
      description: "Validates stock in the database, then returns subtotal, discount\
        \ and total. The discount is applied once over the subtotal."
      operationId: calculateTotal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
        required: true
      responses:
        "409":
          description: Insufficient stock for one or more SKUs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Order calculated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResult"
  /api/info:
    get:
      tags:
      - Info
      summary: Get the active environment
      description: Returns the name of the active Spring profile.
      operationId: info
      responses:
        "200":
          description: Active environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
components:
  schemas:
    OrderItem:
      required:
      - quantity
      - sku
      - unitPrice
      type: object
      properties:
        sku:
          type: string
          description: Product SKU
          example: RICE
        quantity:
          minimum: 1
          type: integer
          description: Quantity ordered (greater than zero)
          format: int32
          example: 2
        unitPrice:
          minimum: 0
          type: number
          description: Unit price (zero or greater)
          example: 50000
      description: Order line
    OrderRequest:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: Order lines; at least one item is required
          items:
            $ref: "#/components/schemas/OrderItem"
        discountPercentage:
          maximum: 100
          minimum: 0
          type: number
          description: Discount percentage applied once over the subtotal (0 to 100)
          example: 10
          default: 0
      description: Order calculation input
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "Insufficient stock for: RICE"
      description: Error response
    OrderResult:
      type: object
      properties:
        subtotal:
          type: number
          description: Sum of quantity times unit price
          example: 160000.0
        discount:
          type: number
          description: Discount amount
          example: 16000.0
        total:
          type: number
          description: Total to pay
          example: 144000.0
      description: Order calculation result
    InfoResponse:
      type: object
      properties:
        environment:
          type: string
          description: Active environment name
          example: development
      description: Runtime environment information
